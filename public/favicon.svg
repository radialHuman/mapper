<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun (central black circle) -->
  <circle cx="200" cy="200" r="50" fill="black" />

  <!-- Planet (orbiting circle) -->
  <circle cx="200" cy="200" r="100" fill="none" stroke="blue" stroke-width="2" />
  
  <!-- Orbit path (elliptical path for planet) -->
  <circle cx="200" cy="200" r="100" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2" />
</svg>